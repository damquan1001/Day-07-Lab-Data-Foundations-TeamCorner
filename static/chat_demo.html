<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Law Chat Live</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #20242c;
      --muted: #697281;
      --line: #d9e0ea;
      --soft-line: #e9edf3;
      --surface: #ffffff;
      --panel: #f7f9fc;
      --sidebar: #162033;
      --sidebar-soft: #22304a;
      --teal: #0f766e;
      --teal-strong: #115e59;
      --blue: #2563eb;
      --amber: #b45309;
      --green-soft: #e8f7f3;
      --blue-soft: #edf4ff;
      --amber-soft: #fff6df;
      --shadow: 0 16px 42px rgba(23, 32, 51, 0.12);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background: #edf1f6;
      letter-spacing: 0;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 318px minmax(0, 1fr);
    }

    aside {
      min-height: 100vh;
      background: var(--sidebar);
      color: #f8fafc;
      padding: 18px;
      display: grid;
      grid-template-rows: auto auto auto minmax(0, 1fr);
      gap: 18px;
      border-right: 1px solid rgba(255, 255, 255, 0.08);
    }

    .brand h1 {
      margin: 0;
      font-size: 21px;
      line-height: 1.2;
      font-weight: 760;
    }

    .brand p {
      margin: 8px 0 0;
      color: #b8c3d3;
      font-size: 13px;
      line-height: 1.45;
    }

    .metric-stack {
      display: grid;
      gap: 8px;
    }

    .metric {
      min-height: 58px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.06);
      border-radius: 8px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .metric span {
      color: #c7d2e2;
      font-size: 12px;
      font-weight: 650;
    }

    .metric strong {
      color: #ffffff;
      font-size: 18px;
    }

    .control-panel {
      display: grid;
      gap: 14px;
    }

    .control-group {
      display: grid;
      gap: 8px;
    }

    label,
    .label {
      color: #cbd5e1;
      font-size: 12px;
      font-weight: 680;
    }

    .segmented {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(255, 255, 255, 0.06);
      border-radius: 8px;
      padding: 3px;
      gap: 3px;
    }

    .segmented.compact {
      grid-template-columns: repeat(3, 1fr);
      max-width: 180px;
    }

    .segmented button {
      min-height: 34px;
      border: 0;
      border-radius: 6px;
      color: #dbe5f2;
      background: transparent;
      font-size: 13px;
      font-weight: 720;
    }

    .segmented button.active {
      background: #ffffff;
      color: var(--sidebar);
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.14);
    }

    .toggle-row {
      min-height: 42px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.06);
      border-radius: 8px;
      padding: 8px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .toggle-row input {
      width: 18px;
      height: 18px;
      accent-color: var(--teal);
    }

    .toggle-row span {
      color: #ecf3fb;
      font-size: 13px;
      font-weight: 650;
    }

    .presets {
      min-height: 0;
      overflow: auto;
      display: grid;
      gap: 8px;
      padding-right: 2px;
    }

    .preset {
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #e8eef8;
      background: rgba(255, 255, 255, 0.055);
      border-radius: 8px;
      padding: 10px 11px;
      text-align: left;
      font-size: 13px;
      line-height: 1.38;
    }

    .preset:hover,
    .preset:focus {
      background: rgba(255, 255, 255, 0.12);
      outline: none;
    }

    main {
      min-width: 0;
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
    }

    .topbar {
      min-height: 72px;
      background: rgba(255, 255, 255, 0.94);
      border-bottom: 1px solid var(--line);
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }

    .topbar-title {
      min-width: 0;
      display: grid;
      gap: 4px;
    }

    .topbar-title strong {
      font-size: 17px;
      line-height: 1.25;
    }

    .topbar-title span {
      color: var(--muted);
      font-size: 13px;
    }

    .status-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
    }

    .chip {
      min-height: 30px;
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 5px 10px;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }

    .chip.good {
      background: var(--green-soft);
      border-color: #bde7d9;
      color: var(--teal-strong);
    }

    .chip.blue {
      background: var(--blue-soft);
      border-color: #c9dbff;
      color: var(--blue);
    }

    .chat {
      min-height: 0;
      overflow: auto;
      padding: 22px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .message {
      width: min(100%, 1040px);
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .message.user {
      align-self: flex-end;
      width: min(100%, 760px);
      background: #eaf3ff;
      border-color: #c6dbff;
      box-shadow: none;
      padding: 13px 15px;
      line-height: 1.5;
    }

    .message-head {
      min-height: 46px;
      border-bottom: 1px solid var(--soft-line);
      padding: 11px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .message-head strong {
      font-size: 14px;
    }

    .message-body {
      padding: 14px;
      display: grid;
      gap: 14px;
    }

    .answer {
      margin: 0;
      font-size: 15px;
      line-height: 1.62;
    }

    .results {
      display: grid;
      border: 1px solid var(--soft-line);
      border-radius: 8px;
      overflow: hidden;
    }

    .result {
      display: grid;
      grid-template-columns: minmax(120px, 190px) minmax(0, 1fr);
      gap: 12px;
      padding: 12px;
      background: var(--surface);
      border-top: 1px solid var(--soft-line);
    }

    .result:first-child {
      border-top: 0;
    }

    .result-id {
      display: grid;
      align-content: start;
      gap: 6px;
    }

    .result-id strong {
      font-size: 14px;
    }

    .result-id span,
    .result-text {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .score-line {
      height: 8px;
      border-radius: 999px;
      background: #e6ebf2;
      overflow: hidden;
    }

    .score-line span {
      display: block;
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--teal), var(--blue));
    }

    .score-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }

    .tag {
      display: inline-flex;
      min-height: 24px;
      align-items: center;
      border-radius: 999px;
      background: var(--panel);
      border: 1px solid var(--soft-line);
      color: var(--muted);
      padding: 3px 8px;
      font-size: 12px;
      font-weight: 650;
    }

    .comparison {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .compare-card {
      min-height: 146px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      padding: 12px;
      display: grid;
      gap: 8px;
      align-content: start;
    }

    .compare-card h3 {
      margin: 0;
      color: var(--teal-strong);
      font-size: 13px;
      text-transform: uppercase;
    }

    .compare-card p {
      margin: 0;
      color: #343c48;
      font-size: 13px;
      line-height: 1.42;
    }

    .composer {
      min-height: 74px;
      border-top: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.96);
      padding: 14px 20px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      gap: 10px;
      align-items: center;
    }

    .composer input {
      width: 100%;
      min-height: 44px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 12px;
      color: var(--ink);
      background: #ffffff;
      outline: none;
    }

    .composer input:focus {
      border-color: var(--teal);
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.14);
    }

    .button {
      min-height: 44px;
      border: 0;
      border-radius: 8px;
      padding: 0 15px;
      font-weight: 760;
      white-space: nowrap;
    }

    .button.primary {
      color: #ffffff;
      background: var(--teal);
    }

    .button.primary:hover {
      background: var(--teal-strong);
    }

    .button.secondary {
      color: #253044;
      background: #eef3f8;
      border: 1px solid var(--line);
    }

    @media (max-width: 920px) {
      .app {
        grid-template-columns: 1fr;
      }

      aside {
        min-height: auto;
        max-height: 46vh;
      }

      .topbar,
      .composer {
        grid-template-columns: 1fr;
      }

      .topbar {
        align-items: flex-start;
      }

      .status-row {
        justify-content: flex-start;
      }

      .composer {
        display: grid;
      }

      .comparison,
      .result {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside>
      <div class="brand">
        <h1>AI Law Chat Live</h1>
        <p>Ask the law corpus with Vector, BM25, or Hybrid retrieval, then let Gemini answer from the retrieved sources.</p>
      </div>

      <div class="metric-stack">
        <div class="metric">
          <span>Articles</span>
          <strong id="docCount">--</strong>
        </div>
        <div class="metric">
          <span>Answer engine</span>
          <strong id="engineState">Local</strong>
        </div>
      </div>

      <div class="control-panel">
        <div class="control-group">
          <div class="label">Strategy</div>
          <div class="segmented" id="strategyGroup">
            <button type="button" data-value="hybrid" class="active">Hybrid</button>
            <button type="button" data-value="bm25">BM25</button>
            <button type="button" data-value="vector">Vector</button>
          </div>
        </div>

        <div class="control-group">
          <label for="topK">Top K</label>
          <div class="segmented compact" id="topKGroup">
            <button type="button" data-value="1">1</button>
            <button type="button" data-value="3" class="active">3</button>
            <button type="button" data-value="5">5</button>
          </div>
        </div>

        <label class="toggle-row" for="geminiToggle">
          <span id="geminiToggleLabel">Gemini answer</span>
          <input id="geminiToggle" type="checkbox">
        </label>
      </div>

      <div class="control-group">
        <div class="label">Preset Questions</div>
        <div id="presets" class="presets"></div>
      </div>
    </aside>

    <main>
      <div class="topbar">
        <div class="topbar-title">
          <strong>Live Retrieval Chat</strong>
          <span id="status">Loading law data...</span>
        </div>
        <div class="status-row">
          <span id="strategyChip" class="chip good">Hybrid</span>
          <span id="llmChip" class="chip">Retrieval preview</span>
          <span class="chip blue">TeamCorner</span>
        </div>
      </div>

      <section id="chat" class="chat" aria-live="polite"></section>

      <form id="composer" class="composer">
        <input id="question" name="question" autocomplete="off" placeholder="Nhập câu hỏi về Luật Trí tuệ nhân tạo...">
        <button class="button secondary" type="button" id="compare">Compare</button>
        <button class="button primary" type="submit">Search</button>
      </form>
    </main>
  </div>

  <script>
    const chat = document.querySelector("#chat");
    const presets = document.querySelector("#presets");
    const statusText = document.querySelector("#status");
    const questionInput = document.querySelector("#question");
    const compareButton = document.querySelector("#compare");
    const composer = document.querySelector("#composer");
    const docCount = document.querySelector("#docCount");
    const engineState = document.querySelector("#engineState");
    const llmChip = document.querySelector("#llmChip");
    const strategyChip = document.querySelector("#strategyChip");
    const geminiToggle = document.querySelector("#geminiToggle");
    const geminiToggleLabel = document.querySelector("#geminiToggleLabel");
    const strategyGroup = document.querySelector("#strategyGroup");
    const topKGroup = document.querySelector("#topKGroup");

    const state = {
      strategy: "hybrid",
      topK: 3,
      geminiAvailable: false
    };

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function setSegment(group, value, targetKey) {
      state[targetKey] = targetKey === "topK" ? Number(value) : value;
      group.querySelectorAll("button").forEach(button => {
        button.classList.toggle("active", button.dataset.value === String(value));
      });
      if (targetKey === "strategy") {
        strategyChip.textContent = value.toUpperCase();
      }
    }

    function sourceLabel(source) {
      if (source && source.startsWith("gemini:")) return source.replace("gemini:", "Gemini ");
      return "Retrieval preview";
    }

    function addUserMessage(question) {
      const node = document.createElement("article");
      node.className = "message user";
      node.textContent = question;
      chat.appendChild(node);
      chat.scrollTop = chat.scrollHeight;
    }

    function scoreWidth(value) {
      const number = Number(value);
      if (!Number.isFinite(number)) return 0;
      return Math.max(6, Math.min(100, number * 100));
    }

    function resultRow(result, index) {
      const scoreTags = [`score ${result.score}`];
      if (result.bm25_score !== undefined) scoreTags.push(`bm25 ${result.bm25_score}`);
      if (result.vector_score !== undefined) scoreTags.push(`vector ${result.vector_score}`);
      return `
        <div class="result">
          <div class="result-id">
            <strong>${escapeHtml(result.article || `Result ${index + 1}`)}</strong>
            <span>${escapeHtml(result.title || "Untitled")}</span>
            <div class="score-line"><span style="width: ${scoreWidth(result.score)}%"></span></div>
            <div class="score-meta">${scoreTags.map(tag => `<span class="tag">${escapeHtml(tag)}</span>`).join("")}</div>
          </div>
          <div class="result-text">${escapeHtml(result.preview)}</div>
        </div>
      `;
    }

    function addSearchMessage(payload) {
      const node = document.createElement("article");
      node.className = "message";
      node.innerHTML = `
        <div class="message-head">
          <strong>${escapeHtml(payload.strategy.toUpperCase())}</strong>
          <span class="chip ${payload.answer_source && payload.answer_source.startsWith("gemini:") ? "good" : ""}">
            ${escapeHtml(sourceLabel(payload.answer_source))}
          </span>
        </div>
        <div class="message-body">
          <p class="answer">${escapeHtml(payload.answer)}</p>
          <div class="results">${payload.results.map(resultRow).join("")}</div>
        </div>
      `;
      chat.appendChild(node);
      chat.scrollTop = chat.scrollHeight;
    }

    function addCompareMessage(payload) {
      const node = document.createElement("article");
      node.className = "message";
      const cards = payload.comparisons.map(item => {
        const top = item.results[0] || {};
        return `
          <div class="compare-card">
            <h3>${escapeHtml(item.strategy)}</h3>
            <p><strong>${escapeHtml(top.article || "No result")}</strong></p>
            <p>${escapeHtml(top.title || "")}</p>
            <p>score ${escapeHtml(top.score ?? "")}</p>
          </div>
        `;
      }).join("");
      node.innerHTML = `
        <div class="message-head">
          <strong>Strategy comparison</strong>
          <span class="chip">top_k=${escapeHtml(payload.top_k)}</span>
        </div>
        <div class="message-body">
          <div class="comparison">${cards}</div>
        </div>
      `;
      chat.appendChild(node);
      chat.scrollTop = chat.scrollHeight;
    }

    async function postJson(url, payload) {
      const response = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || "Request failed");
      return data;
    }

    async function submitQuestion(question, compare = false) {
      const trimmed = question.trim();
      if (!trimmed) return;
      addUserMessage(trimmed);
      questionInput.value = "";
      statusText.textContent = compare ? "Comparing strategies..." : "Retrieving context...";
      try {
        const payload = {
          question: trimmed,
          strategy: state.strategy,
          top_k: state.topK,
          use_gemini: geminiToggle.checked && state.geminiAvailable
        };
        if (compare) {
          addCompareMessage(await postJson("/api/compare", payload));
        } else {
          addSearchMessage(await postJson("/api/search", payload));
        }
        statusText.textContent = "Ready";
      } catch (error) {
        statusText.textContent = error.message;
      }
    }

    async function loadQuestions() {
      const response = await fetch("/api/questions");
      const data = await response.json();
      state.geminiAvailable = Boolean(data.llm && data.llm.available);
      docCount.textContent = data.document_count;
      engineState.textContent = state.geminiAvailable ? "Gemini" : "Local";
      llmChip.textContent = state.geminiAvailable ? data.llm.model : "Retrieval preview";
      llmChip.classList.toggle("good", state.geminiAvailable);
      geminiToggle.checked = state.geminiAvailable;
      geminiToggle.disabled = !state.geminiAvailable;
      geminiToggleLabel.textContent = state.geminiAvailable ? "Gemini answer" : "Gemini unavailable";
      statusText.textContent = `${data.document_count} article chunks loaded`;
      presets.innerHTML = "";
      data.questions.forEach(question => {
        const button = document.createElement("button");
        button.className = "preset";
        button.type = "button";
        button.textContent = question;
        button.addEventListener("click", () => submitQuestion(question));
        presets.appendChild(button);
      });
      if (data.questions[0]) questionInput.value = data.questions[0];
    }

    strategyGroup.addEventListener("click", event => {
      const button = event.target.closest("button[data-value]");
      if (button) setSegment(strategyGroup, button.dataset.value, "strategy");
    });

    topKGroup.addEventListener("click", event => {
      const button = event.target.closest("button[data-value]");
      if (button) setSegment(topKGroup, button.dataset.value, "topK");
    });

    composer.addEventListener("submit", event => {
      event.preventDefault();
      submitQuestion(questionInput.value);
    });

    compareButton.addEventListener("click", () => submitQuestion(questionInput.value, true));

    loadQuestions();
  </script>
</body>
</html>
